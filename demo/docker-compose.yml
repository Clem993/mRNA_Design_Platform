version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: mrna_studio_demo_db
    environment:
      POSTGRES_DB: mrna_studio
      POSTGRES_USER: demo_user
      POSTGRES_PASSWORD: demo_pass_2024
    ports:
      - "5432:5432"
    volumes:
      - ./init_postgres.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo_user -d mrna_studio"]
      interval: 5s
      timeout: 5s
      retries: 5
