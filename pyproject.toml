[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mrna-design-studio"
version = "0.1.0"
description = "mRNA Design Studio — sequence analysis, optimization, and plasmid assembly"
requires-python = ">=3.10"
dependencies = [
    # UI
    "panel>=1.4",
    "param>=2.1",
    "bokeh>=3.4",
    "plotly>=5.20",
    # Bioinformatics
    "biopython>=1.83",
    "dna-features-viewer>=3.1",
    "pygenomeviz>=0.4",
    # Optimization
    "dnachisel>=3.2",
    # Data
    "pandas>=2.0",
    "numpy>=1.26",
    "openpyxl>=3.1",   # Excel import
    # Database
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",   # PostgreSQL driver
    # HTTP (model API calls)
    "httpx>=0.27",
    # Utilities
    "pydantic>=2.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[project.scripts]
mrna-studio = "ui.app:main"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.hatch.build.targets.wheel]
packages = ["core", "models", "ui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
